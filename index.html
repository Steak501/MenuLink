<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEAK 501</title>
<meta name="description" content="STEAK 501: menu, Instagram and Google reviews.">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg: #000;
    --green: #22c55e;
    --white: #fff;
    --text: #f3ead8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(2.6rem, 14vw, 3.8rem);
    letter-spacing: 0.12em;
    line-height: 1;
    color: var(--white);
  }
  h1 span { color: var(--green); }
  .rule {
    width: 72px;
    height: 2px;
    margin: 22px auto 40px;
    background: var(--green);
    border: 0;
  }
  nav { display: grid; gap: 16px; }
  a.btn {
    display: block;
    padding: 20px 16px;
    background: var(--white);
    border: 2px solid var(--white);
    border-radius: 4px;
    color: #000;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    -webkit-tap-highlight-color: transparent;
  }
  a.btn:hover, a.btn:active { background: var(--green); border-color: var(--green); color: #000; }
  a.btn:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
  a.phone {
    display: inline-block;
    margin-top: 34px;
    color: var(--white);
    text-decoration: none;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
  }
  a.phone span { color: var(--green); }
</style>
</head>
<body>
<main>
  <h1>STEAK <span>501</span></h1>
  <hr class="rule">
  <nav>
    <a class="btn" href="https://www.instagram.com/steak.501" target="_blank" rel="noopener">Instagram</a>
    <a class="btn" href="https://share.google/UJhmcvG350TSCWdZT" target="_blank" rel="noopener">Leave a Google Review</a>
    <a class="btn" href="menu.pdf">View Menu</a>
  </nav>
  <a class="phone" href="tel:0797171719"><span>Call</span> 07 9717 1719</a>
</main>
</body>
</html>
